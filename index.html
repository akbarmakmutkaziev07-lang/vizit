<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Premium Digital Card</title>
<style>
:root{--gold:#c9a45c;--gold2:#f0d89b;--bg:#090909;--panel:#111;--muted:#aaa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 14px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#292116 0%,#111 35%,#070707 75%);font-family:Arial,Helvetica,sans-serif;color:#f7f4ed}
.card{width:min(100%,430px);border:1px solid rgba(201,164,92,.48);border-radius:26px;overflow:hidden;background:linear-gradient(155deg,#1b1a17,#0b0b0b 58%);box-shadow:0 25px 80px #000b,0 0 35px #c9a45c12}
.top{padding:25px 22px 18px;text-align:center;border-bottom:1px solid #c9a45c35}
.logo{font-size:19px;letter-spacing:5px;color:var(--gold2);font-weight:700}
.logo small{display:block;margin-top:7px;font-size:9px;letter-spacing:3px;color:#aaa;font-weight:400}
.photo{margin:22px 22px 0;height:235px;border-radius:17px;border:1px solid #c9a45c66;background:linear-gradient(135deg,#29251e,#111);display:grid;place-items:center;color:var(--gold);font-size:15px;letter-spacing:2px;background-size:cover;background-position:center;overflow:hidden}
.identity{text-align:center;padding:22px 20px 12px}
h1{font-size:24px;line-height:1.2;margin:0 0 9px;font-weight:600;letter-spacing:.3px}
.role{font-size:13px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase}
.rule{width:54px;height:1px;background:var(--gold);margin:19px auto 4px}
.contacts{padding:8px 23px 18px}
.contact{display:flex;align-items:center;gap:14px;padding:13px 0;text-decoration:none;color:#f7f4ed;border-bottom:1px solid #ffffff12}
.contact:last-child{border:0}
.icon{height:39px;width:39px;flex:0 0 39px;border:1px solid #c9a45c66;border-radius:12px;display:grid;place-items:center;color:var(--gold2);font-size:17px}
.label{display:block;font-size:10px;color:#999;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
.value{font-size:14px;overflow-wrap:anywhere}
.actions{padding:0 22px 24px;display:grid;gap:10px}
button{width:100%;border:0;border-radius:12px;padding:15px;background:linear-gradient(110deg,#a9823f,#e3c47f,#a9823f);color:#17130c;font-weight:800;letter-spacing:1px;font-size:12px;cursor:pointer}
.share{display:block;text-align:center;padding:14px;border:1px solid #c9a45c66;border-radius:12px;color:var(--gold2);text-decoration:none;font-size:12px;letter-spacing:1px}
footer{text-align:center;padding:0 15px 22px;color:#777;font-size:9px;letter-spacing:2px}
@media(max-width:360px){.photo{height:200px}h1{font-size:21px}}
</style>
</head>

const profile = {
  name: "Макмутказиев Акбар",
  role: "Начальник · Руслан и Компания",
  phone: "+996700559706",
  whatsapp: "https://wa.me/qr/E7FOHTWGNNSCI1",
  email: "akbarmakmutkaziev007@gmail.com",
  instagram: "",
  instagramUrl: ""
};
const digits = s => (s || "").replace(/\D/g, "");
document.getElementById("name").textContent=profile.name;
document.getElementById("role").textContent=profile.role;
document.getElementById("phone").textContent=profile.phone;
document.getElementById("phoneLink").href="tel:"+profile.phone.replace(/[^\d+]/g,"");
document.getElementById("wa").textContent=profile.whatsapp ? "Открыть WhatsApp" : "Добавьте WhatsApp";
document.getElementById("waLink").href=profile.whatsapp ? (profile.whatsapp.startsWith("http") ? profile.whatsapp : "https://wa.me/"+digits(profile.whatsapp)) : "#";
document.getElementById("mail").textContent=profile.email || "Добавьте электронную почту";
document.getElementById("mailLink").href=profile.email ? "mailto:"+profile.email : "#";
document.getElementById("insta").textContent=profile.instagram || "Добавьте Instagram";
document.getElementById("instaLink").href=profile.instagramUrl || "#";
if(!profile.instagram && !profile.instagramUrl) document.getElementById("instaLink").style.display="none";
function saveContact(){
 const v=["BEGIN:VCARD","VERSION:3.0","FN:"+profile.name,"TITLE:"+profile.role,"TEL;TYPE=CELL:"+profile.phone];
 if(profile.email)v.push("EMAIL:"+profile.email);
 if(profile.instagramUrl)v.push("URL:"+profile.instagramUrl);
 v.push("END:VCARD");
 const blob=new Blob([v.join("\r\n")],{type:"text/vcard;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="akbar-contact.vcf";a.click();URL.revokeObjectURL(url);
}
async function shareCard(e){
 e.preventDefault();
 if(navigator.share){try{await navigator.share({title:profile.name,text:"Моя электронная визитка",url:location.href})}catch(_){}}
 else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert("Ссылка скопирована")}
 else alert("Скопируйте адрес страницы из браузера");
}
</script>
